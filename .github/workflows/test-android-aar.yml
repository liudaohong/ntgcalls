# TEST ONLY - not part of the upstream PR.
# Builds an Android AAR (arm64-v8a + x86_64) from this branch and uploads it as an artifact.
name: Test Android AAR
on:
  push:
    branches: [ test/android-aar-early-candidates ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install Python Requirements
        run: python -m pip install setuptools
      - name: Build native libs
        run: python setup.py build_lib --target=android
      - name: Assemble AAR
        run: bash targets/android/gradlew assembleRelease --no-configuration-cache -p targets/android
      - uses: actions/upload-artifact@v7
        with:
          name: ntgcalls-android-aar
          path: targets/android/app/build/outputs/aar/*.aar
          if-no-files-found: error
